# Automated Backup System Configuration
# Comprehensive settings for all automated backup systems

# =============================================================================
# GENERAL BACKUP SETTINGS
# =============================================================================

# Number of days to retain automatic backups (default: 180)
BACKUP_RETENTION_DAYS=180

# Allowed application names for deployment operations (space-separated list)
# Used by deploy.sh to validate app names before cf push operations
# Add new app names here as needed
ALLOWED_APP_NAMES="cms www waf cron"

# Backup naming prefix for static site and public files (default: AUTO)
BACKUP_PREFIX=AUTO

# Storage paths for auto backups (separate from manual snapshot backups)
AUTO_STATIC_BACKUP_PATH=auto-backups/web-backup
AUTO_PUBLIC_BACKUP_PATH=auto-backups/public_backup
AUTO_DB_BACKUP_PATH=auto-backups/database

# Additional S3 copy parameters for backups (optional)
# Example: --storage-class STANDARD_IA
BACKUP_S3_EXTRA_PARAMS=""

# Minimum hours between automatic backups (throttling) - prevents backup churn during active Tome runs
# Only applies when using --throttle flag (used by Tome automation)
# Set to 0 to disable throttling
BACKUP_THROTTLE_HOURS=4

# =============================================================================
# STATIC SITE BACKUP SETTINGS
# =============================================================================

# Enable/disable automatic static site backups during Tome runs (true/false)
ENABLE_STATIC_AUTO_BACKUPS=true

# Enable/disable automatic cleanup of old static site backups (true/false)
ENABLE_STATIC_AUTO_CLEANUP=true

# =============================================================================
# PUBLIC FILES BACKUP SETTINGS
# =============================================================================

# Enable/disable automatic public files backups during Tome runs (true/false)
ENABLE_PUBLIC_AUTO_BACKUPS=true

# Enable/disable automatic cleanup of old public files backups (true/false)
ENABLE_PUBLIC_AUTO_CLEANUP=true

# Enable/disable smart public files backup (skips backup if files unchanged)
ENABLE_SMART_PUBLIC_BACKUP=true

# =============================================================================
# DATABASE BACKUP SETTINGS
# =============================================================================

# Enable/disable daily scheduled database backups (true/false)
ENABLE_DB_BACKUPS=true

# Enable/disable automatic cleanup of old database backups (true/false)
ENABLE_DB_AUTO_CLEANUP=true

# Time to run daily database backups (24-hour format, UTC)
DB_BACKUP_TIME="23:00"

# Number of days to retain database backups (SSPP minimum: 180)
DB_BACKUP_RETENTION_DAYS=180

# Database backup naming prefix (unified with other backups: AUTO)
DB_BACKUP_PREFIX=AUTO

# =============================================================================
# SYSTEM CONSTANTS
# =============================================================================

# Minimum hours a backup must exist before it can be deleted (prevents immediate deletion)
RETENTION_MIN_HOURS=48

# Restore safety guard: a static/public restore uses "aws s3 sync --delete", so a
# truncated or partially written backup would delete live content that the backup
# does not contain. Restore refuses to run when the backup holds less than this
# percentage of the objects currently live, unless --force-destructive-sync is
# given. Set to 0 to disable the guard (not recommended).
RESTORE_MIN_SOURCE_PERCENT=50

# Seconds between backup operations (prevents backup spam, protects database/S3)
# Recommended: 60 for testing, 300 for production
RATE_LIMIT_SECONDS=60

# Maximum attempts to acquire lock before giving up
MAX_RETRY_ATTEMPTS=100

# Timeout in seconds for acquiring flock on rate limit file
FLOCK_TIMEOUT_SECONDS=15

# Maximum length for backup tag names
TAG_MAX_LENGTH=200

# Maximum minutes to wait for Tome static site generation to stop
MAX_WAIT_TOME_MINUTES=30

# Cross-instance backup lock.
#
# Production runs more than one CMS instance and every instance installs the same
# daily cron entry, so without a shared lock they dump the database and write the
# same S3 keys concurrently. The flock and rate-limit files are per-container and
# cannot see across instances; this lock is an S3 object created with
# If-None-Match, which is atomic at the bucket.
BACKUP_LOCK_PATH=backup-locks/backup.lock

# How long a lock stays valid. A holder that is killed without releasing would
# otherwise block every later backup, so a contender may take over a lock older
# than this. Must exceed the longest expected backup: a full run of all three
# types on production takes well under an hour.
BACKUP_LOCK_TTL_SECONDS=7200