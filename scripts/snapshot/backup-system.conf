# Automated Backup System Configuration
# Comprehensive settings for all automated backup systems

# =============================================================================
# GENERAL BACKUP SETTINGS
# =============================================================================

# Number of days to retain automatic backups (default: 180)
BACKUP_RETENTION_DAYS=180

# Backup naming prefix for static site and public files (default: AUTO)
BACKUP_PREFIX=AUTO

# Storage paths for auto backups (separate from manual snapshot backups)
AUTO_STATIC_BACKUP_PATH=auto-backups/web-backup
AUTO_PUBLIC_BACKUP_PATH=auto-backups/public_backup
AUTO_DB_BACKUP_PATH=auto-backups/database

# Additional S3 copy parameters for backups (optional)
# Example: --storage-class STANDARD_IA
BACKUP_S3_EXTRA_PARAMS=""

# Minimum hours between automatic backups (throttling) - prevents backup churn during active Tome runs
# Only applies when using --throttle flag (used by Tome automation)
# Set to 0 to disable throttling
BACKUP_THROTTLE_HOURS=4

# =============================================================================
# STATIC SITE BACKUP SETTINGS
# =============================================================================

# Enable/disable automatic static site backups during Tome runs (true/false)
ENABLE_STATIC_AUTO_BACKUPS=true

# Enable/disable automatic cleanup of old static site backups (true/false)
ENABLE_STATIC_AUTO_CLEANUP=true

# =============================================================================
# PUBLIC FILES BACKUP SETTINGS
# =============================================================================

# Enable/disable automatic public files backups during Tome runs (true/false)
ENABLE_PUBLIC_AUTO_BACKUPS=true

# Enable/disable automatic cleanup of old public files backups (true/false)
ENABLE_PUBLIC_AUTO_CLEANUP=true

# Enable/disable smart public files backup (skips backup if files unchanged)
ENABLE_SMART_PUBLIC_BACKUP=true

# =============================================================================
# DATABASE BACKUP SETTINGS
# =============================================================================

# Enable/disable daily scheduled database backups (true/false)
ENABLE_DB_BACKUPS=true

# Enable/disable automatic cleanup of old database backups (true/false)
ENABLE_DB_AUTO_CLEANUP=true

# Time to run daily database backups (24-hour format, EST)
DB_BACKUP_TIME="21:00"

# Number of days to retain database backups (SSPP minimum: 180)
DB_BACKUP_RETENTION_DAYS=180

# Database backup naming prefix (unified with other backups: AUTO)
DB_BACKUP_PREFIX=AUTO