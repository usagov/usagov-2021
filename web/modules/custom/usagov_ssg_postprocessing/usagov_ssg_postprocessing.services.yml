services:
  usagov_ssg_postprocessing.static_html_subscriber:
    class: '\Drupal\usagov_ssg_postprocessing\EventSubscriber\StaticHtmlSubscriber'
    tags:
      - { name: 'event_subscriber' }
  usagov_ssg_postprocessing.static_path_collection_subscriber:
    class: '\Drupal\usagov_ssg_postprocessing\EventSubscriber\StaticPathCollectionSubscriber'
    arguments: ['@entity_type.manager']
    tags:
      - { name: 'event_subscriber' }
  usagov_ssg_postprocessing.static_path_placeholder_subscriber:
    class: '\Drupal\usagov_ssg_postprocessing\EventSubscriber\StaticPathPlaceholderSubscriber'
    tags:
      - { name: 'event_subscriber' }
  usagov_ssg_postprocessing.static_destination_subscriber:
    class: '\Drupal\usagov_ssg_postprocessing\EventSubscriber\StaticDestinationSubscriber'
    tags:
      - { name: 'event_subscriber' }
  usagov_ssg_postprocessing_request_prepare_events_subscriber:
    class: '\Drupal\usagov_ssg_postprocessing\EventSubscriber\RequestPrepareSubscriber'
    arguments: ['@path_alias.manager', '@entity_type.manager', '@current_route_match']
    tags:
      - { name: 'event_subscriber' }
