name: USAGov Chatbot Style
parameters:
  style: >
    font-family: system-ui, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", sans-serif;
    border: 2px solid #000000;
    background-color: #FFFFFF;
  textInput:
    styles:
      container:
        borderRadius: "4px"
        border: "1px solid #000000"
        width: "75%"
        marginLeft: "-40px"
      text:
        padding: "10px"
        paddingLeft: "15px"
        paddingRight: "34px"
    placeholder:
      text: "Enter a prompt here..."
      style:
        color: "#757575"

  messageStyles:
    default:
      shared:
        bubble:
          marginTop: "10px"
          marginBottom: "10px"
          borderRadius: "4px"
      user:
        bubble:
          background: "#112f4e"
      ai:
        bubble:
          background: "#E9F6FB"

  microphone:
    button:
      default:
        container:
          default:
            bottom: "1em"
            right: "0.6em"
            borderRadius: "20px"
            width: "1.9em"
            height: "1.9em"
        svg:
          styles:
            default:
              bottom: "0.35em"
              left: "0.35em"
      position: "inside-right"
      
  submitButtonStyles:
    position: "outside-right"
    submit:
      container:
        default:
          backgroundColor: "#00BDE3"
          marginBottom: "0"
          padding: "6px 5px 4px"
          border: "2px solid #1B1B1B"
        hover:
          backgroundColor: "#009EC1"
        click:
          backgroundColor: "#009EC1"
      text:
        content: "Send"
        styles:  
          default:
            color: "#1B1B1B"
    loading:
      bubble: 
        backgroundColor: "#00BDE3"
        color: "white"
    stop:
      container:
        hover:
          backgroundColor: "#00BDE3"
      svg:
        styles:
          default:
            filter: >
              brightness(0) saturate(100%) invert(72%) sepia(0%) saturate(3044%)
              hue-rotate(322deg) brightness(100%) contrast(96%)
