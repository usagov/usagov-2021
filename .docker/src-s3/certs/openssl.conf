# Self-signed certificate for the local S3 service ("s3" in docker-compose.yml).
#
# Nothing verifies it today: nginx doesn't verify proxied upstreams, s3fs has
# disable_cert_verify on in settings.local.php, and the scripts pass
# --no-verify-ssl. The names still match so it can be trusted if that changes.
#
# To regenerate it (valid for 10 years), run from the project root:
#
#   openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -config .docker/src-s3/certs/openssl.conf -extensions v3_req \
#     -keyout .docker/src-s3/certs/private.key \
#     -out .docker/src-s3/certs/public.crt
#
# The file mode of private.key doesn't matter: .docker/src-s3/start.sh copies
# both files, as root, to where the SeaweedFS user can read them.

[req]
distinguished_name = req_distinguished_name
x509_extensions = v3_req
prompt = no

[req_distinguished_name]
C = US
O = USAGov local development
CN = s3

[v3_req]
subjectAltName = @alt_names

[alt_names]
DNS.1 = s3
DNS.2 = local.s3
DNS.3 = localhost
IP.1 = 127.0.0.1
