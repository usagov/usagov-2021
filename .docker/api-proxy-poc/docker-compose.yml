services:
  proxyapi:
    container_name: proxyapi
    image: php:5.6-apache
    ports:
      - "88:80" 
    volumes:
      - ./public:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
      - ./php-prepend.php:/usr/local/lib/php-prepend.php
    environment:
      # THESE VARIABLES SHOULD COME FROM CLOUD.GOV
      GOOGLE_KEY: AIzaSyDgYFMaq0e-u3EZPPhTrBN0jL1uoc8Lm0A
      CICERO_TOKEN: 6so-979f1fa01b441e5c9910&user=3149

  varnish:
    image: varnish:7
    container_name: varnish
    ports:
      - "89:80" 
    environment:
      - VARNISH_SIZE=256M
    volumes:
      - ./default.vcl:/etc/varnish/default.vcl
    depends_on:
      - proxyapi
