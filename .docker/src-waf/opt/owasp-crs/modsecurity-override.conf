#SecArgumentSeparator &

# -- Audit logging ------------------------------------------------------------
# DELIBERATELY OFF. Do not enable without reading this first.
#
# An earlier revision turned on a JSON audit log to /dev/stdout to make the
# detection-only CRS rollout observable. That broke New Relic: the logshipper's
# parse_modsecurity_keys.lua is written solely for ModSecurity's bracketed
# nginx error-log alert format. It triggers on any line containing
# "modsecurity" -- which audit records do, via CRS rule paths and the producer
# field -- and its "%[(.-)%]" extractor then matches JSON *arrays* rather than
# alert brackets, emitting object keys with unescaped quotes. The result is
# malformed JSON.
#
# The audit log was never needed. ModSecurity-nginx already emits every matched
# rule message at NGX_LOG_INFO; it was only invisible because nginx.conf.tmpl
# pinned error_log to "warn". That is now "info", so detections land in the
# error log in exactly the format the Lua parser expects.
#
# If a future change genuinely needs the audit log, note that part C (request
# body) and E (response body) capture user form input -- CMS logins,
# benefit-finder answers -- and must not be enabled without a privacy review.
SecAuditEngine Off
#SecAuditLog /dev/stdout
#SecAuditLogFormat JSON
#SecAuditLogType Serial
#SecAuditLogParts ABHZ
#SecAuditLogRelevantStatus "^(?:5|4(?!04))"
#SecAuditLogStorageDir /var/log/modsecurity/audit/
#SecCookieFormat 0
#SecDataDir /tmp/modsecurity/data
#SecDebugLog /var/log/modsecurity/debug.log
#SecDebugLogLevel 3
#SecPcreMatchLimit 100000
#SecPcreMatchLimitRecursion 100000
#SecRequestBodyAccess on
#SecRequestBodyLimit 13107200
#SecRequestBodyJsonDepthLimit 512
#SecRequestBodyLimitAction Reject
#SecRequestBodyNoFilesLimit 131072
#SecResponseBodyAccess on
#SecResponseBodyLimit 1048576
#SecResponseBodyLimitAction ProcessPartial
#SecResponseBodyMimeType text/plain text/html text/xml
#SecRuleEngine On
#SecTmpDir /tmp/modsecurity/tmp
#SecTmpSaveUploadedFiles on
#SecUnicodeMapFile unicode.mapping 20127
#SecUploadDir /tmp/modsecurity/upload
#SecUploadFileMode 0644
#SecRule REQUEST_URI "@beginsWith /node" "id:700004, phase:1,log,allow, msg:'Node URI accessed'"
