#SecArgumentSeparator &

# -- Audit logging ------------------------------------------------------------
# Required for the detection-only CRS rollout to be observable at all.
# ModSecurity-nginx writes to the nginx error log ONLY when it blocks a request.
# CRS in detection-only mode blocks nothing, so without the audit log below its
# findings are invisible. See etc/nginx/snippets/owasp-modsecurity-main.conf.
#
# RelevantOnly with no SecAuditLogRelevantStatus set means: log a transaction
# only when a rule flagged with "auditlog" actually matched. CRS rules all carry
# auditlog, so detections are captured even though they return 200. Ordinary
# traffic produces no audit records, which keeps ingest volume down and avoids
# duplicating the 4xx/5xx already covered by the access log.
SecAuditEngine RelevantOnly
SecAuditLog /dev/stdout
SecAuditLogFormat JSON
SecAuditLogType Serial
# Parts: A=header, B=request headers, H=trailer (contains the rule Messages), Z=terminator.
# Deliberately EXCLUDES part C (request body) and E (response body) so that user
# form input -- CMS logins, benefit-finder answers -- is not captured wholesale.
# Do not add C or E without a privacy review.
# Two residual exposures to be aware of, both verified in local testing:
#   - part B carries request headers, including cookies;
#   - a matched rule's "logdata" still quotes the offending fragment, e.g.
#     "Matched Data: ... found within ARGS:id: 1' OR '1'='1". That is the
#     evidence the alert exists to convey, but it does mean a matched argument
#     value can appear in logs even without part C.
SecAuditLogParts ABHZ
#SecAuditLogRelevantStatus "^(?:5|4(?!04))"
#SecAuditLogStorageDir /var/log/modsecurity/audit/
#SecCookieFormat 0
#SecDataDir /tmp/modsecurity/data
#SecDebugLog /var/log/modsecurity/debug.log
#SecDebugLogLevel 3
#SecPcreMatchLimit 100000
#SecPcreMatchLimitRecursion 100000
#SecRequestBodyAccess on
#SecRequestBodyLimit 13107200
#SecRequestBodyJsonDepthLimit 512
#SecRequestBodyLimitAction Reject
#SecRequestBodyNoFilesLimit 131072
#SecResponseBodyAccess on
#SecResponseBodyLimit 1048576
#SecResponseBodyLimitAction ProcessPartial
#SecResponseBodyMimeType text/plain text/html text/xml
#SecRuleEngine On
#SecTmpDir /tmp/modsecurity/tmp
#SecTmpSaveUploadedFiles on
#SecUnicodeMapFile unicode.mapping 20127
#SecUploadDir /tmp/modsecurity/upload
#SecUploadFileMode 0644
#SecRule REQUEST_URI "@beginsWith /node" "id:700004, phase:1,log,allow, msg:'Node URI accessed'"
