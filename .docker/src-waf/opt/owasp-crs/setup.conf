# NOT LOADED. nginx loads etc/nginx/snippets/owasp-modsecurity-main.conf
# instead (see conf.d/default.conf, modsecurity_rules_file). Kept only because
# Dockerfile-waf copies it to /etc/modsecurity.d/setup.conf, which is the
# conventional entrypoint for the upstream owasp/modsecurity-crs image.
#
# The paths below previously referenced /etc/modsecurity.d/owasp-crs/, which
# this image never creates -- Dockerfile-waf installs the CRS release to
# /etc/modsecurity.d/modsecurity-crs/. They are corrected here so this file
# would work if anything ever did load it. Keep it in sync with
# owasp-modsecurity-main.conf.

Include /etc/modsecurity.d/modsecurity.conf
Include /etc/modsecurity.d/modsecurity-override.conf

Include /etc/modsecurity.d/modsecurity-crs/crs-setup.conf
Include /etc/modsecurity.d/modsecurity-crs/rules/*.conf
