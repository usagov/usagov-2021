# This is the file nginx actually loads; see conf.d/default.conf
# (modsecurity_rules_file). Load order below is significant.

# 1. Engine settings and the CRS-recommended request-body sanity rules
#    (200000-200007). Rules 200002/200003 block malformed bodies with a 400.
Include /opt/owasp-crs/modsecurity.conf
Include /opt/owasp-crs/modsecurity-override.conf

# 2. CRS configuration. This is the copy that docker-entrypoint-waf.sh tunes
#    via /opt/modsecurity/activate-rules.sh (PARANOIA, anomaly thresholds,
#    allowed methods, SecDefaultAction, ...), so it must be the one we load.
Include /etc/modsecurity.d/modsecurity-crs/crs-setup.conf

# 3. USAGov's own pre-CRS exclusions. Must precede the CRS rules: it sets
#    tx.crs_exclusions_drupal, which REQUEST-901-INITIALIZATION reads.
Include /opt/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf

# 4. The CRS attack rules themselves (SQLi, XSS, RCE, traversal, ...).
Include /etc/modsecurity.d/modsecurity-crs/rules/*.conf

# 5. USAGov's own post-CRS exclusions.
Include /opt/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf

# 6. Detection-only rollout for CRS.
#    949110/959100 are the CRS blocking-evaluation rules: they turn an
#    accumulated anomaly score into a 403. Forcing them to "pass" leaves every
#    CRS rule matching and scoring but never blocking, while rules 200002/200003
#    above keep their existing blocking behaviour -- so enabling CRS does not
#    change what we currently reject.
#    Must appear AFTER the rules they target are defined.
#    To move to blocking: comment out these two lines, one env at a time.
#
#    VISIBILITY -- READ BEFORE CHANGING THE LOG LEVEL:
#    Detections reach the logs only because nginx.conf.tmpl sets
#    "error_log /dev/stderr info". ModSecurity-nginx emits matched rule messages
#    through its msc_set_log_cb callback at NGX_LOG_INFO, and logs interventions
#    (actual blocks) at NGX_LOG_ERR. Since the two lines below stop CRS from
#    ever blocking, every CRS detection arrives via the INFO path -- so dropping
#    the error log back to "warn" makes this whole stage silent.
#    Do NOT solve that by enabling the JSON audit log; it breaks the
#    logshipper's parse_modsecurity_keys.lua. See modsecurity-override.conf.
SecRuleUpdateActionById 949110 "pass"
SecRuleUpdateActionById 959100 "pass"
