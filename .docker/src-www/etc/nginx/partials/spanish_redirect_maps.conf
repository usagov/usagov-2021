# USAGOV-2946: Spanish pages are hidden. Every /es request is sent to English
# with a 302 (see spanish_redirects.conf): to the English equivalent when one
# is known, otherwise to the English homepage. Spanish content stays published
# in the CMS and in the S3 static site; it just isn't served from here.
#
# To bring Spanish back: remove the spanish_redirects.conf include from
# www_common.conf.tmpl and set usagov_hide_spanish to FALSE in settings.php.
#
# This file is included at http level (conf.d/default.conf). The map hash
# sizes it needs are set in nginx.conf, because nginx only accepts them
# before the first map.

# Lookup key: the lower-cased path ($request_uri_lowercase, set in
# www_common.conf) without trailing slashes.
map $request_uri_lowercase $spanish_redirect_key {
    default                        $request_uri_lowercase;
    "~^(?<spanish_trimmed>.*?)/+$" $spanish_trimmed;
}

# Empty means "not a Spanish URL; serve normally".
map $spanish_redirect_key $spanish_redirect_target {
    default "";

    # Exact Spanish -> English pairs, generated by
    # scripts/drush/spanish-redirect-map.php.
    include /etc/nginx/partials/spanish_redirect_map_entries.conf;

    # Agency index letter pages are views output, not nodes.
    "~^/es/indice-agencias/(?<spanish_agency_letter>[a-z])$" /agency-index/$spanish_agency_letter;

    # Everything else under /es, including /es itself: English homepage.
    "~^/es(/|$)" /;
}
