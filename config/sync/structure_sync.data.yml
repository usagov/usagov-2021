          value: "<div class=\"usa-navbar\">\r\n  <div class=\"usa-logo\" id=\"extended-logo\">\r\n    <em class=\"usa-logo-text\">\r\n          <a href=\"/es\" title=\"USAGov Logo\"><img class=\"es\" src=\"/themes/custom/usagov/images/LOGO_betasite_USAGOV_SP.png\" alt=\"USAGov en Español Logo\"></a>\r\n        </em>\r\n  </div>\r\n  <button class=\"usa-menu-btn\">Menu</button>\r\n</div>\r\n<nav aria-label=\"Primary navigation\" class=\"usa-nav\">\r\n  <div class=\"usa-nav__inner\">\r\n    <button class=\"usa-nav__close\">\r\n      <img src=\"/themes/custom/usagov/assets/img/usa-icons/close.svg\" role=\"img\" alt=\"Close\" />\r\n    </button>\r\n    <ul class=\"usa-nav__primary usa-accordion\">\r\n    <li class=\"usa-nav__primary-item\"><a href=\"/es#all_topics\" class=\"usa-nav__link\"><span>Todos los temas y servicios</span></a>\r\n    </li>\r\n    <li class=\"usa-nav__primary-item\" id=\"usa-nav__acerca\"><a href=\"/es/acerca-de-estados-unidos\" class=\"usa-nav__link\"><span>Acerca de EE. UU. y directorios del Gobierno</span></a>\r\n    </li>\r\n    <li class=\"usa-nav__primary-item\" id=\"usa-nav__dinero\"><a href=\"/es/dinero\" class=\"usa-nav__link\"><span>Dinero</span></a>\r\n    </li>\r\n<li class=\"usa-nav__primary-item\" id=\"usa-nav__leyes\"><a href=\"/es/leyes-y-asuntos-legales\" class=\"usa-nav__link\"><span>Leyes y asuntos legales</span></a>\r\n    </li>\r\n<li class=\"usa-nav__primary-item\"  id=\"usa-nav__estafas\"><a href=\"/es/estafas-y-fraudes\" class=\"usa-nav__link\"><span>Estafas y fraudes</span></a>\r\n    </li>\r\n</ul>\r\n    <div class=\"usa-nav__secondary\">\r\n      <span class=\"usa-nav__secondary-links\">\r\n        <span id=\"top-phone\" class=\"usa-nav__secondary-item\">\r\n          <a href=\"/es/centro-de-llamadas\" style=\"white-space: nowrap;\">Llámenos al 1-844-USAGOV1</a>\r\n        </span>\r\n      </span>\r\n\r\n      <form class=\"usa-search usa-search--small\" action=\"https://search.usa.gov/search\" method=\"get\" name=\"search_form\" accept-charset=\"UTF-8\" role=\"search\">\r\n        <label id=\"top-srch\" class=\"usa-sr-only\" for=\"search-field-small\">Buscar</label>\r\n        <input id=\"affiliate\" name=\"affiliate\" type=\"hidden\" value=\"usagov_es_all_gov\">\r\n        <input id=\"search-field-small\" class=\"usa-input text usagov-search-autocomplete ui-autocomplete-input\" type=\"search\" name=\"query\" placeholder=\"Busque en el Gobierno ...\" onfocus=\"this.placeholder = ''\" autocomplete=\"off\" aria-autocomplete=\"list\" aria-haspopup=\"true\">\r\n        <button class=\"usa-button\" type=\"submit\">\r\n          <img src=\"/themes/custom/usagov/images/search--dark.svg\" class=\"usa-search__submit-icon\" alt=\"Search\">\r\n        </button>\r\n      </form>\r\n    </div>\r\n  </div>\r\n</nav>"
          summary: ''
          format: html
