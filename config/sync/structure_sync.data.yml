      body:
        -
          value: "<section class=\"usa-banner\">\r\n    <div class=\"usa-banner\">\r\n  <div class=\"usa-accordion\">\r\n    <header class=\"usa-banner__header\">\r\n      <div class=\"usa-banner__inner\">\r\n        <div class=\"grid-col-auto\">\r\n          <img class=\"usa-banner__header-flag\" src=\"/themes/custom/usagov/images/favicon-57.png\" alt=\"U.S. flag\">\r\n        </div>\r\n        <div class=\"grid-col-fill tablet:grid-col-auto\">\r\n          <p class=\"usa-banner__header-text\">Un sitio oficial del Gobierno de Estados Unidos</p>\r\n          <p class=\"usa-banner__header-action\" aria-hidden=\"true\">Así es como usted puede verificarlo</p>\r\n        </div>\r\n        <button class=\"usa-accordion__button usa-banner__button\" aria-expanded=\"false\" aria-controls=\"gov-banner\">\r\n          <span class=\"usa-banner__button-text\">Así es como usted puede verificarlo</span>\r\n        </button>\r\n      </div>\r\n    </header>\r\n    <div class=\"usa-banner__content usa-accordion__content\" id=\"gov-banner\" hidden=\"\">\r\n      <div class=\"grid-row grid-gap-lg\">\r\n        <div class=\"usa-banner__guidance tablet:grid-col-6\">\r\n          <img class=\"usa-banner__icon usa-media-block__img\" src=\"/themes/custom/usagov/assets/img/icon-dot-gov.svg\" alt=\"Dot gov\">\r\n          <div class=\"usa-media-block__body\">\r\n            <p>\r\n              <strong>Los sitios web oficiales usan .gov</strong>\r\n              <br>\r\n              Un sitio web <strong>.gov</strong> pertenece a una organización oficial del Gobierno de Estados Unidos.\r\n            </p>\r\n          </div>\r\n        </div>\r\n        <div class=\"usa-banner__guidance tablet:grid-col-6\">\r\n          <img class=\"usa-banner__icon usa-media-block__img\" src=\"/themes/custom/usagov/assets/img/icon-https.svg\" alt=\"Https\">\r\n          <div class=\"usa-media-block__body\">\r\n            <p>\r\n              <strong>Los sitios web seguros .gov usan HTTPS</strong>\r\n              <br>\r\n              Un <strong>candado</strong> (<span class=\"icon-lock\">\r\n                <svg xmlns=\"http://www.w3.org/2000/svg\" width=\"52\" height=\"64\" viewBox=\"0 0 52 64\" class=\"usa-banner__lock-image\" role=\"img\" aria-labelledby=\"banner-lock-title-lang-es banner-lock-description-lang-es\">\r\n                    <title id=\"banner-lock-title-lang-es\">Lock</title>\r\n                    <desc id=\"banner-lock-description-lang-es\">A locked padlock</desc>\r\n                    <path fill=\"#000000\" fill-rule=\"evenodd\" d=\"M26 0c10.493 0 19 8.507 19 19v9h3a4 4 0 0 1 4 4v28a4 4 0 0 1-4 4H4a4 4 0 0 1-4-4V32a4 4 0 0 1 4-4h3v-9C7 8.507 15.507 0 26 0zm0 8c-5.979 0-10.843 4.77-10.996 10.712L15 19v9h22v-9c0-6.075-4.925-11-11-11z\"></path>\r\n                </svg>\r\n            </span>) o https:// significa que usted se conectó de forma segura a un sitio web .gov. Comparta información sensible sólo en sitios web oficiales y seguros.\r\n            </p>\r\n          </div>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  </div>\r\n</div>\r\n\r\n  </section>"
          summary: ''
          format: html
