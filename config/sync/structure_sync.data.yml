          value: "<div class=\"usa-navbar\">\r\n    <div class=\"usa-logo\" id=\"extended-logo\">\r\n      <em class=\"usa-logo-text\">\r\n            <a href=\"/\" title=\"USAGov Logo\"><img src=\"/themes/custom/usagov/images/LOGO_betasite_USAGOV_v2.png\" alt=\"USAGov Logo\"></a>\r\n          </em>\r\n    </div>\r\n    <button class=\"usa-menu-btn\">Menu</button>\r\n  </div>\r\n  <nav aria-label=\"Primary navigation\" class=\"usa-nav\">\r\n    <div class=\"usa-nav__inner\">\r\n      <button class=\"usa-nav__close\">\r\n        <img src=\"/themes/custom/usagov/assets/img/usa-icons/close.svg\" role=\"img\" alt=\"Close\" />\r\n      </button>\r\n      <ul class=\"usa-nav__primary usa-accordion\">\r\n        <li class=\"usa-nav__primary-item\"><a href=\"/#all_topics\" class=\"usa-nav__link\"><span>All topics and services</span></a>\r\n        </li>\r\n        <li class=\"usa-nav__primary-item\"  id=\"usa-nav__about\"><a href=\"/about-the-us\" class=\"usa-nav__link\"><span>About the U.S. and its government</span></a>\r\n        </li>\r\n        <li class=\"usa-nav__primary-item\" id=\"usa-nav__money\"><a href=\"/money\" class=\"usa-nav__link\"><span>Money</span></a>\r\n        </li>\r\n    <li class=\"usa-nav__primary-item\"  id=\"usa-nav__law\"><a href=\"/laws-and-legal-issues\" class=\"usa-nav__link\"><span>Laws and legal issues</span></a>\r\n        </li>\r\n    <li class=\"usa-nav__primary-item\" id=\"usa-nav__scams\"><a href=\"/scams-and-fraud\" class=\"usa-nav__link\"><span>Scams and fraud</span></a>\r\n        </li>\r\n </ul>\r\n      <div class=\"usa-nav__secondary\">\r\n        <span class=\"usa-nav__secondary-links\">\r\n          <span id=\"top-phone\" class=\"usa-nav__secondary-item\">\r\n            <a href=\"/phone\">Call us at 1-844-USAGOV1</a>\r\n          </span>\r\n        </span>\r\n\r\n        <form class=\"usa-search usa-search--small\" action=\"https://search.usa.gov/search\" method=\"get\" name=\"search_form\" accept-charset=\"UTF-8\" role=\"search\">\r\n            <label id=\"top-srch\" class=\"usa-sr-only\" for=\"search-field-small\">Search</label>\r\n            <input id=\"affiliate\" name=\"affiliate\" type=\"hidden\" value=\"usagov_all_gov\">\r\n            <input id=\"search-field-small\" class=\"usa-input text usagov-search-autocomplete ui-autocomplete-input\" type=\"search\" name=\"query\" placeholder=\"Search all government\" onfocus=\"this.placeholder = ''\" autocomplete=\"off\" aria-autocomplete=\"list\" aria-haspopup=\"true\">\r\n            <button class=\"usa-button\" type=\"submit\">\r\n              <img src=\"/themes/custom/usagov/images/search--dark.svg\" class=\"usa-search__submit-icon\" alt=\"Search\">\r\n            </button>\r\n        </form>\r\n      </div>\r\n    </div>\r\n  </nav>"
