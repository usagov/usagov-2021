    rev_id_current: null
    fields:
      body:
        -
          value: "<div class=\"usa-footer__secondary-section\">\r\n    <div class=\"grid-container\">\r\n        <div class=\"grid-row grid-gap\">\r\n            <div class=\"usa-footer__logo grid-row mobile-lg:grid-col-6 mobile-lg:grid-gap-2\">\r\n             <span id=\"bottom-phone\">\r\n                <div class=\"mobile-lg:grid-col-auto\">\r\n                    <h3 class=\"usa-footer__logo-heading\">\r\n                        Centro de contacto de USAGov en Español\r\n                    </h3>\r\n                </div>\r\n\r\n                <div class=\"mobile-lg:grid-col-auto\">\r\n                    <p>Haga una pregunta a USAGov en Español al</p>\r\n\r\n                    <address class=\"usa-footer__address\">\r\n                        <div class=\"usa-footer__contact-info grid-row grid-gap\">\r\n                            <a href=\"/es/centro-de-llamadas\">1-844-USAGOV1 (1-844-872-4681)</a>\r\n                        </div>\r\n                    </address>\r\n                </div>\r\n          </span>\r\n            </div>\r\n\r\n            <div class=\"usa-footer__contact-links mobile-lg:grid-col-6\">\r\n                <h3 class=\"usa-footer__contact-heading es\">Encuéntrenos en las <span>redes sociales</span></h3>\r\n\r\n                <div class=\"usa-footer__social-links sm-sp-links grid-row grid-gap-1\">\r\n                    <div class=\"grid-col-auto\">\r\n                        <a class=\"usa-social-link\" href=\"https://www.facebook.com/usagovespanol\" alt=\"Facebook USAGov\">                      \r\n                        <img src=\"/themes/custom/usagov/images/facebook34.png\" alt=\"Facebook USAGov\" />\r\n                            <span>Facebook</span>\r\n                        </a>\r\n                    </div>\r\n\r\n                    <div class=\"grid-col-auto\">\r\n                        <a class=\"usa-social-link\" href=\"https://twitter.com/usagovespanol\" alt=\"Twitter USAGov\">\r\n                        <img src=\"/themes/custom/usagov/images/twitter34.png\" alt=\"Twitter USAGov\" />\r\n                            <span>Twitter</span>\r\n                        </a>\r\n                    </div>\r\n\r\n                    <div class=\"grid-col-auto\">\r\n                        <a class=\"usa-social-link\" href=\"https://www.youtube.com/USAgovespanol\" alt=\"YouTube USAGov\">\r\n                        <img src=\"/themes/custom/usagov/images/youtube34.png\" alt=\"Youtube USAGov\" />\r\n                            <span>YouTube</span>\r\n                        </a>\r\n                    </div>\r\n                </div>\r\n            </div>\r\n        </div>\r\n    </div>\r\n</div>"
          summary: ''
          format: html
