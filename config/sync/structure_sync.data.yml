col-4\">\r\n        <div class=\"usa-sign-up\">\r\n          <h3 class=\"usa-sign-up__heading\">Suscríbase para recibir información actualizada</h3>\r\n          <form class=\"usa-form\" action=\"https://conectate.gobiernousa.gov/suscripciones\" method=\"get\">\r\n            <label class=\"usa-label\" for=\"email\">Escriba su email</label>\r\n            <input class=\"usa-input\" id=\"email\" name=\"email\" type=\"email\">\r\n            <button class=\"usa-button\" type=\"submit\">Suscríbase ahora</button>\r\n          </form>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  </div>\r\n</div>"
