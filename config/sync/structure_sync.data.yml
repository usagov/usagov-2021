    revision_id: null
    rev_id_current: null
    fields:
      body:
        -
          value: "<div class=\"usa-footer__primary-section\">\r\n  <div class=\"grid-container\">\r\n      <div class=\"grid-row grid-gap\">\r\n        <div class=\"tablet:grid-col-8\">\r\n          <nav class=\"usa-footer__nav\" aria-label=\"Footer navigation,,\">\r\n            <div class=\"grid-row grid-gap-4\">\r\n              <div class=\"mobile-lg:grid-col-6 desktop:grid-col-3\">\r\n                <section class=\"\r\n                    usa-footer__primary-content\r\n                    usa-footer__primary-content--collapsible\r\n                  \">\r\n                  <h3 class=\"usa-footer__primary-link\">Government information</h3>\r\n                  <ul class=\"usa-list usa-list--unstyled\">\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"/\"> All topics and services </a>\r\n                    </li>\r\n\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"https://www.usa.gov/federal-agencies\">Directory of U.S. government agencies and departments</a>\r\n                    </li>\r\n\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"/branches-of-government\">\r\n                      Branches of government\r\n                      </a>\r\n                    </li>\r\n                  </ul>\r\n                </section>\r\n              </div>\r\n\r\n              <div class=\"mobile-lg:grid-col-6 desktop:grid-col-3\">\r\n                <section class=\"\r\n                    usa-footer__primary-content\r\n                    usa-footer__primary-content--collapsible\r\n                  \">\r\n                  <h3 class=\"usa-footer__primary-link\">About us</h3>\r\n                  <ul class=\"usa-list usa-list--unstyled\">\r\n                    <li class=\"usa-footer__secondary-link ftr-list\">\r\n                      <a href=\"/mission-history\"> Our mission and history </a>\r\n                    </li>\r\n\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"/privacy-security\">\r\n                        Privacy and security policies\r\n                      </a>\r\n                    </li>\r\n\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"/accessibility\">Accessibility policy</a>\r\n                    </li>\r\n\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"/how-to-cite\"> How to cite USA.gov </a>\r\n                    </li>\r\n            \r\n                     <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"https://analytics.usa.gov/\"> Real-time website data </a>\r\n                    </li>\r\n\r\n                  </ul>\r\n                </section>\r\n              </div>\r\n\r\n              <div class=\"mobile-lg:grid-col-6 desktop:grid-col-3\">\r\n                <section class=\"\r\n                    usa-footer__primary-content\r\n                    usa-footer__primary-content--collapsible\r\n                  \">\r\n                  <h3 class=\"usa-footer__primary-link\">For federal agencies</h3>\r\n                  <ul class=\"usa-list usa-list--unstyled\">\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"/partner-with-usagov\"> Partner with us </a>\r\n                    </li>\r\n\r\n                    <li class=\"usa-footer__secondary-link\">\r\n                      <a href=\"https://blog.usa.gov/\"> USAGov blog </a>\r\n                    </li>\r\n                  </ul>\r\n                </section>\r\n              </div>\r\n\r\n              <div class=\"mobile-lg:grid-col-6 desktop:grid-col-3\">\r\n                <section class=\"\r\n                    usa-footer__primary-content\r\n                    usa-footer__primary-content--collapsible\r\n                  \">\r\n                  <h3 class=\"usa-footer__primary-link\">For media</h3>\r\n                  <ul class=\"usa-list usa-list--unstyled\">\r\n                    <li class=\"usa-footer__secondary-link ftr-list\">\r\n                      <a href=\"/features\"> Feature articles </a>\r\n                    </li>\r\n                  </ul>\r\n                </section>\r\n              </div>\r\n            </div>\r\n          </nav>\r\n        </div>\r\n        <div class=\"tablet:grid-col-4\">\r\n          <div class=\"usa-sign-up\">\r\n            <h4 class=\"usa-sign-up__heading\">Sign up to receive email updates</h4>\r\n            <form class=\"usa-form\" action=\"https://connect.usa.gov/subscribe\" method=\"get\">\r\n              <label class=\"usa-label\" for=\"email\">Enter your email</label>\r\n              <input class=\"usa-input\" id=\"email\" name=\"email\" type=\"email\">\r\n              <button class=\"usa-button\" type=\"submit\">Sign up</button>\r\n            </form>\r\n          </div>\r\n        </div>\r\n      </div>\r\n    </div>\r\n</div>\r\n"
          summary: ''
          format: html
