          value: "<div class=\"usa-footer__primary-section\">\r\n  <div class=\"grid-container\">\r\n    <div class=\"grid-row grid-gap\">\r\n      <div class=\"tablet:grid-col-8\">\r\n        <nav class=\"usa-footer__nav\" aria-label=\"Footer navigation,,\">\r\n          <div class=\"grid-row grid-gap-4\">\r\n            <div class=\"mobile-lg:grid-col-6 desktop:grid-col-3\">\r\n              <section class=\"\r\n                  usa-footer__primary-content\r\n                  usa-footer__primary-content--collapsible\">\r\n                <h4 class=\"usa-footer__primary-link\">Información del Gobierno</h4>\r\n                <ul class=\"usa-list usa-list--unstyled\">\r\n                  <li class=\"usa-footer__secondary-link\">\r\n                    <a href=\"/es\"> Todos los temas y servicios</a>\r\n                  </li>\r\n\r\n                  <li class=\"usa-footer__secondary-link\">\r\n                    <a href=\"https://www.usa.gov/espanol/agencias-federales\">Directorios de agencias y departamentos del Gobierno de EE. UU.</a>\r\n                  </li>\r\n\r\n                  <li class=\"usa-footer__secondary-link\">\r\n                    <a href=\"https://beta.usa.gov/es/ramas-gobierno-estados-unidos\">Ramas del Gobierno</a>\r\n                  </li>\r\n                </ul>\r\n              </section>\r\n            </div>\r\n\r\n            <div class=\"mobile-lg:grid-col-6 desktop:grid-col-3\">\r\n              <section class=\"\r\n                  usa-footer__primary-content\r\n                  usa-footer__primary-content--collapsible\r\n                \">\r\n                <h4 class=\"usa-footer__primary-link\">Sobre nosotros</h4>\r\n                <ul class=\"usa-list usa-list--unstyled\">\r\n                  <li class=\"usa-footer__secondary-link ftr-list\">\r\n                    <a href=\"https://www.usa.gov/espanol/quienes-somos\">Nuestra historia y misión</a>\r\n                  </li>\r\n\r\n                  <li class=\"usa-foo