services:
  cms:
    container_name: cms
    image: gsatts/usagov-2021:cms-latest
    build:
      context: ./
      dockerfile: .docker/Dockerfile-cms
      args:
        - BUID
        - BGID
        - HOST_ARCH
        - BUILD_ENV
    ports:
      - 80:80
      - 443:443
    networks:
      gsa-gov:
        aliases:
          - beta-local-usagov.apps.internal
          - cms-local-usagov.apps.internal
          - beta-usagov.docker.local
          - cms-usagov.docker.local
    volumes:
      - .:/var/www:delegated
      - ./.docker/src-cms/etc/periodic/1min/generate-static-site:/etc/periodic/1min/generate-static-site:delegated
      - ./.docker/src-cms/50_xdebug.ini:/etc/php83/conf.d/50_xdebug.ini:delegated
    env_file:
      - ./env.local
    environment:
      COMPOSER_MEMORY_LIMIT: -1
      WWW_HOST: beta-local-usagov.apps.internal
      CF_INSTANCE_INDEX: '1'
      FIX_FILE_PERMS:
      VCAP_APPLICATION: >
        {"name":"cms", "application_id":"docker", "space_name":"local", "application_uris":["beta-local-usagov.apps.internal","cms-local-usagov.apps.internal"]}
      VCAP_SERVICES: >
        { "s3": [{
            "name": "storage",
            "credentials": {
              "access_key_id": "s3admin",
              "secret_access_key": "s3adminsecret",
              "region": "us-west-1",
              "bucket": "local",
              "fips_endpoint": "s3:9000",
              "endpoint": "s3:9000"
               }
             },
             {
               "credentials": {
                 "access_key_id": "REPLACE_THIS_IF_YOU_NEED_TO_WRITE_TO_THE_BUCKET",
                 "additional_buckets": [],
                 "bucket": "cg-c4ae21db-2fd9-4501-bce8-549dc06ab668",
                 "endpoint": "s3-fips.us-gov-west-1.amazonaws.com",
                 "fips_endpoint": "s3-fips.us-gov-west-1.amazonaws.com",
                 "insecure_skip_verify": false,
                 "region": "us-gov-west-1",
                 "secret_access_key": "REPLACE_THIS_IF_YOU_NEED_TO_WRITE_TO_THE_BUCKET"
               },
               "instance_name": "s3forAnalyticsReporter",
               "label": "s3",
               "name": "s3forAnalyticsReporter",
               "tags": [
                 "AWS",
                 "S3",
                 "object-storage"
               ]
            }
          ],
          "aws-rds": [{
            "name": "database",
            "credentials": {
              "db_name": "drupal",
              "host": "database",
              "password": "mysql",
              "port": "3306",
              "username": "root"
            }
          }],
          "user-provided": [{
            "name": "secrets",
            "credentials": {
              "ADMIN_EMAIL": "secret@example.com",
              "CRON_KEY": "SECRET",
              "HASH_SALT": "SECRET",
              "ROOT_USER_NAME": "root",
              "ROOT_USER_PASS": "root"
            }
          },
          {
            "name": "secauthsecrets",
            "credentials": {
              "SPKEY": "SPKey",
              "SPCRT": "SPCert"
            }
          }],
         "aws-elasticache-redis": [
          {
            "credentials": {
              "current_redis_engine_version": "6.2",
              "host": "cache",
              "hostname": "cache",
              "password": "CACHE_SERVICE_PASSWORD_FOR_LOCAL_DEV",
              "port": "6379",
              "uri": "redis://:CACHE_SERVICE_PASSWORD_FOR_LOCAL_DEV@cache:6379",
              "IS_LOCAL_DEV": 1
            },
            "name": "cache-service",
            "tags": [
                        "redis",
                        "Elasticache",
                        "AWS",
                        "cache-service"
                ]
          }
        ]
        }
    depends_on:
      - database
      - s3
      - cache

  database:
    container_name: database
    image: mariadb:11.4
    ports:
      - 3306:3306
    volumes:
      - .:/app:delegated
      - database_data:/var/lib/mysql:delegated
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: drupal
    cap_add:
      - SYS_NICE
    networks:
      - gsa-gov

  # Local stand-in for the cloud.gov S3 bucket (SeaweedFS). It must match the
  # "storage" entry in VCAP_SERVICES above: credentials in .docker/src-s3/s3.json,
  # bucket "local" at s3:9000 over HTTPS. s3fs and nginx reach the bucket as
  # local.s3:9000 (virtual-hosted style), and the AWS CLI as s3:9000/local
  # (path style). Load public files with bin/files-update.
  # See docs/Local_S3_for_Dev.md before changing the version.
  s3:
    container_name: s3
    image: chrislusf/seaweedfs:4.53
    init: true
    entrypoint: ["/bin/sh", "/etc/seaweedfs/local/start.sh"]
    command:
      - server
      # Master, volume and filer stay on loopback; only S3 is reachable from
      # the other containers.
      - -ip=127.0.0.1
      - -s3.ip.bind=0.0.0.0
      - -master.telemetry=false
      - -s3
      - -s3.iam=false
      - -s3.port=9000
      - -s3.domainName=s3
      - -s3.config=/etc/seaweedfs/local/s3.json
      - -s3.cert.file=/etc/seaweedfs/certs/public.crt
      - -s3.key.file=/etc/seaweedfs/certs/private.key
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      - S3_BUCKET=local
    volumes:
      - s3_data:/data
      - ./.docker/src-s3:/etc/seaweedfs/local:ro
    networks:
      gsa-gov:
        aliases:
          - local.s3

  cypress:
    container_name: cypress
    build:
      context: ./
      dockerfile: .docker/Dockerfile-cypress
    env_file:
      - ./env.local
      - ./env.local.cypress
    volumes:
      - ./automated_tests/e2e-cypress:/app/e2e-cypress
      - /tmp/.X11-unix:/tmp/.X11-unix
    working_dir: /app
    command: /app/start.sh
    networks:
      - gsa-gov

  composer:
    container_name: composer
    build:
      context: ./
      dockerfile: .docker/Dockerfile-cms
      target: composer-builder
      args:
        - BUID
        - BGID
        - GITCOMMIT
        - GITBRANCH
        - GITTAG
        - BUILD_ENV
    command: echo "Shutting Down on Purpose"
    volumes:
      - .:/var/www:delegated
    env_file:
      - ./env.local

  node:
    container_name: node
    build:
      context: ./
      dockerfile: .docker/Dockerfile-cms
      target: theme-builder
      args:
        - BUID
        - BGID
    command: /var/www/scripts/watch-frontend-assets.sh
    volumes:
      - .:/var/www:delegated
    env_file:
      - ./env.local
    networks:
      - gsa-gov

  cache:
    container_name: cache
    build:
      dockerfile: .docker/Dockerfile-cache
    ports:
      - 6379:6379
    networks:
      - gsa-gov

volumes:
  database_data:
  s3_data:
