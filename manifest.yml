---
applications:
- name: cms
  docker:
    image: gsatts/usagov-2021:cms-latest
  memory: 1.5G
  disk_quota: 5G
  timeout: 180
  services:
    - database
    - secrets
    - secauthsecrets
    - storage
  health-check-type: process
- name: www
  docker:
    image: gsatts/usagov-2021:www-latest
  memory: 256M
  disk_quota: 4G
  timeout: 180
  services:
    - secrets
    - storage
  health-check-type: process
- name: waf
  docker:
    image: gsatts/usagov-2021:waf-latest
  disk_quota: 2G
  memory: 256M
  services:
    - secrets
  health-check-type: process
  env:
    APP_NAME: nginx
    BLOCKED_NAME: USAGov
    IP_ALLOWED: |
      # IPv4 addresses and CIDR blocks go here. Put IPv6 addresses in the IPV6_ALLOWED section.
      # Both groups are validated by startup code; separating them makes the validation easier.

      # GSA CIDR Block
      allow 159.142.0.0/16;

      # ZScaler "edge" addresses; sometimes GSA linux clients come through on these
      allow 159.142.0.128/27;
      allow 159.142.71.0/28;
      allow 136.226.4.0/23;
      allow 136.226.6.0/23;
      allow 136.226.8.0/23;
