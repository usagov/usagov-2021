- name: cron
  docker:
    image: gsatts/usagov-2021:cron
  memory: 128M
  disk_quota: 4G
  timeout: 180
  no-route: true
  services:
    - cron-state-storage
    - cron-event-storage
    - cron-callwait-storage
    - cron-service-account
    - cron-secrets
  health-check-type: process
